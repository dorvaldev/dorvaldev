<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - Strom Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 3rem 2.5rem;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .badge {
            background-color: #f59e0b;
            color: #1e293b;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 2.5rem;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* Fondo decorativo con círculos difuminados */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 20%;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="logo">Strom Studio</div>
        
        <div class="badge">ESTAMOS TRABAJANDO</div>
        
        <h1>Servidores en mantenimiento</h1>
        
        <p>Estamos realizando mejoras en nuestra infraestructura para optimizar la experiencia del usuario. Aprovechamos este proceso para modificar nuestra web y ofrecerte un espacio renovado. Volveremos a estar en línea muy pronto.</p>
    </div>

</body>
</html>
